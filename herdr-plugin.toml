id = "jh.linear"
name = "Linear"
version = "0.3.0"
min_herdr_version = "0.9.3"
description = "Fast Linear lookup in herdr: search, read, and open issues from a palette or a side pane."
platforms = ["macos", "linux"]

# 미리 빌드한 바이너리를 받는다. 쓸 수 없으면 cargo로 빌드한다
[[build]]
command = ["bash", "scripts/install.sh"]

[[actions]]
id = "palette"
title = "Linear: Search palette"
description = "Open the Linear issue search palette (opens the issue directly when an issue ID is selected)"
contexts = ["global", "workspace", "pane", "selection"]
command = ["./target/release/herdr-linear", "open", "palette"]

[[actions]]
id = "side"
title = "Linear: Toggle side pane"
description = "Open or close a Linear pane on the right"
contexts = ["global", "workspace", "pane"]
command = ["./target/release/herdr-linear", "open", "side"]

[[actions]]
id = "open-url"
title = "Linear: Open issue from link"
description = "Open a Ctrl+clicked linear.app issue link in the palette"
contexts = ["global", "workspace", "pane"]
command = ["./target/release/herdr-linear", "open", "url"]

[[actions]]
id = "logout"
title = "Linear: Log out"
description = "Delete the saved API key and cache"
contexts = ["global"]
command = ["./target/release/herdr-linear", "logout"]

[[panes]]
id = "palette"
title = "Linear"
placement = "popup"
width = "80%"
height = "80%"
command = ["./target/release/herdr-linear", "ui", "--mode", "palette"]

[[panes]]
id = "side"
title = "Linear"
placement = "split"
command = ["./target/release/herdr-linear", "ui", "--mode", "side"]

[[link_handlers]]
id = "linear-issue"
title = "Open Linear issue"
pattern = "^https://linear\\.app/[^/]+/issue/[A-Za-z0-9]+-[0-9]+"
action = "open-url"
