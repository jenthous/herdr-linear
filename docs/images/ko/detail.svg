<text x="9 18 27 36 45 54 63 72 81 90 99 108 117 126 135 144 153 162 171 180 189 198 207 216 225 234 243" y="475" fill="#cdd6f4">3. The page reloads forever</text>
<text x="9 18 27 36 45" y="515" fill="#94e2d5" font-weight="bold">Cause</text>
<text x="9 18 27" y="575" fill="#cdd6f4">The</text>
