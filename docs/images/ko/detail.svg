<text x="9 18 27 36 45 54 63 72 81 90 99 108 117 126 135 144 153 162 171 180 189 198 207 216 225 234 243 252 261 270 279 288 297 306 315 324 333 342 351 360 369 378 387 396 405 414 423 432 441 450 459 468 477 486 495 504 513 522 531 540 549 558 567 576 585 594 603 612 621 630 639 648 657 666" y="335" fill="#cdd6f4">Users on Safari 17 get stuck in a redirect loop after signing in with SSO.</text>
<text x="9 18 27 36 45 54 63 72 81 90 99 108 117 126 135 144 153 162" y="375" fill="#94e2d5" font-weight="bold">Steps to reproduce</text>
<text x="9 18 27 36 45 54 63 72 81 90 99 108 117 126 135 144 153 162 171 180 189 198 207 216 225 234 243 252 261 270 279 288 297 306 315 324" y="435" fill="#cdd6f4">1. Sign in with Google SSO on Safari</text>
